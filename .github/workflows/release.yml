name: Release

# 버전 태그(v1.2.3 형식)가 푸시될 때만 실행된다. 브랜치 푸시/PR 에서는 실행되지 않는다.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write   # 릴리즈 생성/파일 업로드

jobs:
  build-dmg:
    runs-on: macos-15
    steps:
      # 공급망 보안: 태그가 아닌 커밋 SHA 로 고정한다. 버전 갱신은 Dependabot PR 로 받는다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 버전 결정 및 형식 검증 (태그 v1.2.3 → 1.2.3)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::태그 형식이 올바르지 않습니다: $GITHUB_REF_NAME (예: v1.2.3, v1.2.3-beta.1)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 빌드 및 DMG 생성 (유니버설, 서명 없음)
        env:
          UNIVERSAL: "1"
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./build.sh dmg

      - name: 산출물 이름 정리 및 체크섬
        run: |
          mv build/Bottari.dmg "build/Bottari-${VERSION}.dmg"
          cd build
          shasum -a 256 "Bottari-${VERSION}.dmg" > "Bottari-${VERSION}.dmg.sha256"
          lipo -archs Bottari.app/Contents/MacOS/Bottari

      - name: 릴리즈 등록
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" \
            "build/Bottari-${VERSION}.dmg" \
            "build/Bottari-${VERSION}.dmg.sha256" \
            --title "Bottari ${VERSION}" \
            --generate-notes \
            --notes "Apple Developer 서명이 없는 빌드입니다. 처음 실행할 때 열리지 않으면 앱을 우클릭 ▸ 열기, 또는 \`xattr -dr com.apple.quarantine /Applications/Bottari.app\` 를 실행하세요." \
            $PRERELEASE
